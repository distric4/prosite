<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — страница не найдена</title>
<style>
@font-face{
  font-family:'Druk Wide';
  src:url('/assets/static.tildacdn.pub/tild3036-6239-4538-b338-373037366665/Druk-Wide-Cyr-Bold.woff') format('woff');
  font-weight:700; font-style:normal; font-display:swap;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Helvetica Neue',Arial,sans-serif;
  background:#ffffff; color:#171717;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:24px; text-align:center;
}
.wrap{max-width:640px}
.code{
  font-family:'Druk Wide','Arial Black',sans-serif;
  font-weight:700; letter-spacing:-.02em; line-height:.9;
  font-size:clamp(96px,22vw,220px);
}
.code span{color:#00af92}
h1{
  font-family:'Druk Wide','Arial Black',sans-serif;
  font-weight:700; text-transform:uppercase; letter-spacing:.01em;
  font-size:clamp(20px,5vw,34px); margin:18px 0 14px;
}
p{color:#5a5a5a; font-size:clamp(15px,2.4vw,18px); line-height:1.5; margin-bottom:30px}
a.btn{
  display:inline-block; background:#171717; color:#fff; text-decoration:none;
  font-weight:600; font-size:15px; letter-spacing:.03em; text-transform:uppercase;
  padding:17px 38px; border-radius:6px; transition:background .2s;
}
a.btn:hover{background:#00af92}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">4<span>0</span>4</div>
    <h1>Страница не найдена</h1>
    <p>Возможно, ссылка устарела или страница была перемещена. Вернитесь на главную — там всё на месте.</p>
    <a class="btn" href="/">На главную</a>
  </div>
</body>
</html>
